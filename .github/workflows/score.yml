name: Score Submission

on:
  push:
    branches: [main]
    paths:
      - "submissions/*.csv"

permissions:
  contents: write

jobs:
  score:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas

      - name: Restore answer key from secret
        run: |
          mkdir -p data
          echo "${{ secrets.EVAL_ANSWERS_B64 }}" | base64 -d > data/eval_test.csv
          echo "Answer key restored ($(wc -l < data/eval_test.csv) lines)"

      - name: Detect changed submission files
        id: changed
        run: |
          FILES=$(git diff --name-only HEAD~1 HEAD -- 'submissions/*.csv' 2>/dev/null || \
                  find submissions -name "*.csv" 2>/dev/null | head -20)
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "Changed files: $FILES"

      - name: Score each submission and update leaderboard
        run: |
          changed="${{ steps.changed.outputs.files }}"
          if [ -z "$changed" ]; then
            echo "No submission files detected — nothing to score."
            exit 0
          fi
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            [ ! -f "$file" ] && continue
            team=$(basename "$file" .csv)
            echo "──────────────────────────────────"
            echo "Scoring team: $team  ($file)"
            result=$(python evaluate.py "$file" --json)
            echo "Result JSON: $result"
            python update_leaderboard.py "$team" "$result"
          done <<< "$changed"

      - name: Commit updated leaderboard
        run: |
          git config user.name  "hackathon-bot"
          git config user.email "actions@github.com"
          git add docs/leaderboard.json
          if git diff --staged --quiet; then
            echo "Leaderboard unchanged — no commit needed."
          else
            git commit -m "chore: update leaderboard [skip ci]"
            git push
          fi
